{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card p-4">
      <h2 class="mb-3">Patient Registration</h2>
      <p class="text-muted">Create a patient record. Registration does not automatically create a referral.</p>

      <form id="registration-form">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Patient Name</label>
            <input type="text" name="patient_name" class="form-control" value="Jane Doe" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="phone_number" class="form-control" value="+254700000001" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" value="34">
          </div>
        </div>

        <button type="submit" class="btn btn-primary mt-4">Register Patient</button>
      </form>

      <div id="response" class="alert mt-4 d-none"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
