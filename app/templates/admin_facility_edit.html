{% extends 'layout.html' %}
{% block title %}Edit Facility{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div><h2 class="mb-0">Edit Facility</h2><p class="text-muted mb-0">{{ facility.name }}</p></div>
  <a href="/admin/facilities" class="btn btn-outline-primary">Back to Facilities</a>
</div>
<div class="card p-4">
  <form id="facility-edit-form">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Facility Name</label><input id="name" class="form-control" value="{{ facility.name }}" required></div>
      <div class="col-md-3"><label class="form-label">Tier Level</label><input id="tier" type="number" min="2" max="6" class="form-control" value="{{ facility.tier_level }}" required></div>
      <div class="col-md-3"><label class="form-label">Capacity</label><input id="capacity" type="number" min="{{ facility.occupied_capacity }}" class="form-control" value="{{ facility.capacity }}" required><div class="form-text">{{ facility.occupied_capacity }} currently occupied.</div></div>
      <div class="col-md-4"><label class="form-label" for="phone">Phone</label><input id="phone" type="tel" class="form-control" value="{{ contact_info.get('phone', '') }}"></div>
      <div class="col-md-4"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control" value="{{ contact_info.get('email', '') }}"></div>
      <div class="col-md-4"><label class="form-label" for="location">Location</label><input id="location" type="text" class="form-control" value="{{ contact_info.get('location', '') }}"></div>
      <div class="col-md-3 form-check ms-2"><input id="is-active" class="form-check-input" type="checkbox" {% if facility.is_active %}checked{% endif %}><label class="form-check-label" for="is-active">Active facility</label></div>
    </div>
    <div class="mt-4"><button class="btn btn-primary" type="submit">Save Changes</button> <a href="/admin/facilities" class="btn btn-outline-secondary">Cancel</a></div>
  </form>
  <div id="response" class="alert d-none mt-3"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('facility-edit-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const response = document.getElementById('response');
  const contactInfo = {};
  for (const field of ['phone', 'email', 'location']) {
    const value = document.getElementById(field).value.trim();
    if (value) contactInfo[field] = value;
  }
  const res = await fetch('/api/v1/admin/facilities/{{ facility.facility_id }}', {
    method: 'PATCH', headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token() }}'},
    body: JSON.stringify({name: document.getElementById('name').value, tier_level: Number(document.getElementById('tier').value), capacity: Number(document.getElementById('capacity').value), contact_info: contactInfo, is_active: document.getElementById('is-active').checked})
  });
  const result = await res.json(); response.className = `alert ${res.ok ? 'alert-success' : 'alert-danger'} mt-3`; response.textContent = res.ok ? 'Facility updated successfully.' : (result.error || 'Unable to update facility.');
  if (res.ok) window.location.href = '/admin/facilities';
});
</script>
{% endblock %}
